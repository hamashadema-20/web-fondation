<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS</title>
    <style>
      p {
        color: rgb(220, 158, 194);
      }
    </style>
  </head>
  <body>
    <div
      style="
        background-color: darkorchid;
        color: white;
        text-align: center;
        width: 400px;
        border: 5px solid black;
        border-radius: 10px;
        margin: center;
      "
    >
      <h2>Happy Birthday!</h2>
      <img
        style="
          border: 5px solid black;
          border-radius: 10px;
          width: 300px;
          height: 300px;
        "
        src="../public/photo.png"
        alt="Birthday Card"
      />
      <p>Happy birthday sweetie, whish you all the happines in this life</p>
    </div>
  </body>
</html>
